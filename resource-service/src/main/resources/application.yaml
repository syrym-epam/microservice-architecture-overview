server:
  port: 8081
spring:
  application:
    name: resource-service
  datasource:
    url: "${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/resource-db}"
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    # hibernate:
      # ddl-auto: update
    properties:
      hibernate:
        format_sql: true 
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
  kafka:
    bootstrap-servers: "${KAFKA_SERVICE_URL:http://localhost:9092}"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: microservice
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
eureka:
  client:
    service-url: 
      defaultZone: "${EUREKA_SERVICE_URL:http://localhost:8761/eureka}"
    registry-fetch-interval-seconds: 5
  instance:
    lease-renewal-interval-in-seconds: 5
song-service:
  url: "${SONG_SERVICE_URL:http://localhost:8082}"
  
# CLOUD STORAGE
aws:
  region: us-east-1
  backet_name: resource-service
  access_id: "${AWS_ACCESS_KEY_ID:test}"
  access_key: "${AWS_SECRET_ACCESS_KEY:test}"
  localstack-endpoint: "${LOCALSTACK_ENDPOINT:http://localhost:4566}"