spring:
  application:
    name: eureka-service
server:
  port: 8761
eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: "${EUREKA_SERVICE_URL:http://localhost:8761/eureka}"
logging:
  level:
    com.netflix.eureka: OFF
    com.netflix.discovery: OFF
