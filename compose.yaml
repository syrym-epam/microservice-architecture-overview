services:
  resource-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB_RESOURCE}
      POSTGRES_USER: ${POSTGRES_USER}  # Default, can be omitted if unchanged
      POSTGRES_PASSWORD:  ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"  # Maps container port 5432 to host port 5432
    volumes:
      - ./init-scripts/resource-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB_RESOURCE}"]
      interval: 5s
      timeout: 5s
      retries: 5

  song-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB_SONG}
      POSTGRES_USER:  ${POSTGRES_USER}  # Default, can be omitted if unchanged
      POSTGRES_PASSWORD:  ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"  # Maps container port 5432 to host port 5433 (to avoid conflict)
    volumes:
      - ./init-scripts/song-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB_SONG}"]
      interval: 5s
      timeout: 5s
      retries: 5   
    # Emulator S3 Storage
  localstack:
    image: localstack/localstack:latest
    ports:
      - "4566:4566" # LocalStack Gateway
    environment:
      - SERVICES=s3
      - DOCKER_HOST=unix:///var/run/docker.sock
      - LOCALSTACK_AUTH_TOKEN=${LOCALSTACK_AUTH_TOKEN}
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
  eureka-service:
    build:
      context: ./eureka-server
      dockerfile: Dockerfile
    ports:
      - "8761:8761"
    environment:
      - EUREKA_SERVICE_URL=${EUREKA_SERVICE_URL}
  gateway-service:
    build:
      context: ./gateway-service
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - EUREKA_SERVICE_URL=${EUREKA_SERVICE_URL}
  resource-service:
    build:
      context: ./resource-service
      dockerfile: Dockerfile
    environment:
      - SPRING_DATASOURCE_URL=${RESOURCE_SERVICE_DATASOURCE_URL}
      - SONG_SERVICE_URL=${SONG_SERVICE_URL}
      - EUREKA_SERVICE_URL=${EUREKA_SERVICE_URL}
      - LOCALSTACK_ENDPOINT=${LOCALSTACK_ENDPOINT}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - KAFKA_SERVICE_URL=${KAFKA_SERVICE_URL}
    ports:
      - "8081:8081"
    depends_on:
      resource-db:
        condition: service_healthy

  song-service:
    build:
      context: ./song-service
      dockerfile: Dockerfile
    deploy:
      # mode: replicated
      replicas: 2
    environment:
      - SPRING_DATASOURCE_URL=${SONG_SERVICE_DATASOURCE_URL}
      - RESOURCE_SERVICE_URL=${RESOURCE_SERVICE_URL}
      - EUREKA_SERVICE_URL=${EUREKA_SERVICE_URL}
    ports:
      - "8082-8083:8082"
    depends_on:
      song-db:
        condition: service_healthy

  processore-service:
    build:
      context: ./resource-processore
      dockerfile: Dockerfile
    environment:
      - SONG_SERVICE_URL=${SONG_SERVICE_URL}
      - RESOURCE_SERVICE_URL=${RESOURCE_SERVICE_URL}
      - EUREKA_SERVICE_URL=${EUREKA_SERVICE_URL}
      - KAFKA_SERVICE_URL=${KAFKA_SERVICE_URL}
    ports:
      - "8085:8085"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'Mk3OEYBSD3TsfwbfRM1234=='


# For resource-service:
# spring.datasource.url=jdbc:postgresql://localhost:5432/resource-db
# spring.datasource.username=postgres
# spring.datasource.password=postgres
#
# For song-service:
# spring.datasource.url=jdbc:postgresql://localhost:5433/song-db
# spring.datasource.username=postgres
# spring.datasource.password=postgres


