server:
  port: 8082
spring:
  application:
    name: song-service
  datasource:
    url: "${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/song-db}"
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    # hibernate:
      # ddl-auto: update
    show-sql: true
    properties:
      hibernate:
eureka:
  client:
    service-url: 
      defaultZone: "${EUREKA_SERVICE_URL:http://localhost:8761/eureka}"
    registry-fetch-interval-seconds: 5
  instance:
    lease-renewal-interval-in-seconds: 5
resource-service:
  url: "${RESOURCE_SERVICE_URL:http://localhost:8081}"
